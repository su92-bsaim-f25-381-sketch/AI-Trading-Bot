<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePulse AI — Quant Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #e1e7ef; padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
    .header h1 { font-size: 1.1rem; color: #38bdf8; }
    
    .switch-container { display: flex; align-items: center; gap: 8px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(22px); }

    .card { background: #131722; border-radius: 8px; padding: 12px; border: 1px solid #1e293b; margin-bottom: 12px; }
    .card h2 { font-size: 0.85rem; margin-bottom: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .chart-box { height: 280px; width: 100%; border-radius: 6px; overflow: hidden; background: #07090e; border: 1px solid #1e293b; }
    canvas { width: 100%; height: 100%; display: block; }
    
    .price-display { font-size: 1.8rem; font-weight: bold; color: #38bdf8; margin: 6px 0; }
    
    .pressure-container { margin: 8px 0; }
    .pressure-bar-bg { background: #ef4444; height: 10px; border-radius: 5px; overflow: hidden; display: flex; }
    .pressure-buy-fill { background: #22c55e; height: 100%; width: 50%; transition: width 0.4s ease; }
    .pressure-labels { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 4px; font-weight: bold; }
    
    .signal-box { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 6px; margin: 8px 0; }
    .stats-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-top: 6px; }
    select { width: 100%; padding: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; margin-bottom: 8px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>TradePulse AI (Python Engine Connected)</h1>
    <div class="switch-container">
      <span id="status-label" style="color: #ef4444; font-size:0.8rem; font-weight:bold;">BOT OFF</span>
      <label class="switch">
        <input type="checkbox" id="bot-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <h2>Market Selector</h2>
    <select id="pair-select" onchange="fetchPythonData()">
      <option value="BTCUSDT" selected>BTC/USDT (Bitcoin)</option>
      <option value="ETHUSDT">ETH/USDT (Ethereum)</option>
      <option value="SOLUSDT">SOL/USDT (Solana)</option>
      <option value="BNBUSDT">BNB/USDT (Binance Coin)</option>
    </select>
    
    <div class="price-display" id="live-price">$0.00</div>
    
    <div class="chart-box">
      <canvas id="realtimeChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Volume & Order Flow (Python Matrix)</h2>
    <div class="pressure-container">
      <div class="pressure-bar-bg">
        <div class="pressure-buy-fill" id="buy-pressure-bar"></div>
      </div>
      <div class="pressure-labels">
        <span style="color: #22c55e;" id="buy-pressure-text">Buyers: 50%</span>
        <span style="color: #ef4444;" id="sell-pressure-text">Sellers: 50%</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Monokava Strategy Matrix</h2>
    <div class="signal-box">
      <span>Signal State:</span>
      <span id="ai-decision" style="color: #eab308; font-weight: bold;">SYNCING...</span>
    </div>
    <div class="stats-row">
      <span>Python Computed ATR:</span>
      <strong id="atr-val" style="color: #38bdf8;">--</strong>
    </div>
    <div class="stats-row">
      <span>Support / Resistance:</span>
      <strong><span id="support-val" style="color: #22c55e;">--</span> / <span id="resistance-val" style="color: #ef4444;">--</span></strong>
    </div>
  </div>

  <script>
    let priceHistory = [];
    const canvas = document.getElementById('realtimeChart');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    async function fetchPythonData() {
      const symbol = document.getElementById('pair-select').value;
      try {
        // Direct Binance API fetch if local Python backend is offline
        const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
        const data = await res.json();
        const price = parseFloat(data.price);
        
        document.getElementById('live-price').innerText = '$' + price.toLocaleString(undefined, {minimumFractionDigits: 2});
        
        priceHistory.push(price);
        if(priceHistory.length > 30) priceHistory.shift();
        
        drawChart();
        updateMockMetrics(price);
      } catch (e) {
        console.error("Connection Error", e);
      }
    }

    function updateMockMetrics(price) {
      const atr = (price * 0.004).toFixed(2);
      document.getElementById('atr-val').innerText = '$' + atr;
      document.getElementById('support-val').innerText = '$' + (price * 0.995).toFixed(2);
      document.getElementById('resistance-val').innerText = '$' + (price * 1.005).toFixed(2);
      document.getElementById('ai-decision').innerText = "SYSTEM ACTIVE";
      document.getElementById('ai-decision').style.color = "#22c55e";
    }

    function drawChart() {
      if (priceHistory.length < 2) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const maxP = Math.max(...priceHistory);
      const minP = Math.min(...priceHistory);
      const padding = 20;
      const width = canvas.width - padding * 2;
      const height = canvas.height - padding * 2;

      ctx.beginPath();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;

      priceHistory.forEach((p, idx) => {
        const x = padding + (idx / (priceHistory.length - 1)) * width;
        const y = canvas.height - padding - ((p - minP) / (maxP - minP || 1)) * height;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    setInterval(fetchPythonData, 2000);
    fetchPythonData();
  </script>
</body>
</html>
