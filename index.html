<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePulse AI — World Top Indicators Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #e1e7ef; padding: 12px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #1e293b; margin-bottom: 10px; }
    .header h1 { font-size: 0.95rem; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    
    .switch-container { display: flex; align-items: center; gap: 8px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Top Capital & Performance Grid */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
    .stats-grid-top { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    
    .metric-card { background: #1e293b; padding: 8px; border-radius: 6px; text-align: center; }
    .metric-card label { font-size: 0.6rem; color: #94a3b8; display: block; margin-bottom: 2px; }
    .metric-card span { font-size: 0.85rem; font-weight: bold; }

    .stat-card-top { background: #0f172a; border: 1px solid #1e293b; padding: 6px; border-radius: 6px; text-align: center; }
    .stat-card-top label { font-size: 0.58rem; color: #64748b; display: block; }
    .stat-card-top span { font-size: 0.82rem; font-weight: bold; }

    /* Navigation Tabs */
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; border-bottom: 1px solid #1e293b; }
    .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tab-btn:hover { background: #334155; color: #fff; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: #131722; border-radius: 8px; padding: 12px; border: 1px solid #1e293b; margin-bottom: 10px; }
    .card h2 { font-size: 0.8rem; margin-bottom: 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    select, button, input { width: 100%; padding: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    
    .chart-box { height: 480px; width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b; background: #0f172a; position: relative; }
    
    .signal-box { background: #1e293b; padding: 12px; border-radius: 6px; margin: 8px 0; }
    .ai-think-box { font-size: 0.78rem; color: #cbd5e1; background: #0f172a; padding: 10px; border-radius: 4px; border-left: 3px solid #38bdf8; margin-top: 8px; line-height: 1.4; font-family: monospace; }
    
    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn-buy { background: #22c55e; color: #000; padding: 10px; border: none; border-radius: 6px; font-weight: bold; width: 50%; cursor: pointer; }
    .btn-sell { background: #ef4444; color: #fff; padding: 10px; border: none; border-radius: 6px; font-weight: bold; width: 50%; cursor: pointer; }
    .btn-close { background: #334155; color: #fff; padding: 4px 8px; border: none; border-radius: 4px; font-size: 0.72rem; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.75rem; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #1e293b; }
    th { color: #64748b; font-weight: 600; }
