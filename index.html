<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Bot & Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121826;
      color: #ffffff;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #2a3447;
      margin-bottom: 15px;
    }
    .header h1 {
      font-size: 1.4rem;
      color: #00f2fe;
    }
    .status-badge {
      background: #00c853;
      color: #000;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    .card {
      background: #1a2332;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #2a3447;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #4facfe;
    }
    /* Chart Container */
    .chart-container {
      height: 400px;
      width: 100%;
    }
    /* AI Signals */
    .signal-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #243044;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .signal-type {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00e676;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 1rem;
    }
    .btn-buy { background: #00e676; color: #000; }
    .btn-sell { background: #ff5252; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>AI Trading Bot</h1>
    <span class="status-badge">Bot Live</span>
  </div>

  <div class="grid-container">
    
    <!-- Live TradingView Chart -->
    <div class="card">
      <h2>Live Market Chart (BTC/USDT)</h2>
      <div class="chart-container" id="tradingview_chart"></div>
    </div>

    <!-- AI Bot Analysis & Signals -->
    <div class="card">
      <h2>AI Technical Analysis</h2>
      <div class="signal-box">
        <span>Signal Output:</span>
        <span class="signal-type" id="ai-signal">STRONG BUY</span>
      </div>
      <div style="margin-top: 10px; font-size: 0.9rem; color: #a0aec0;">
        <p>• RSI (14): <strong>34.2 (Oversold)</strong></p>
        <p>• MACD: <strong>Bullish Crossover</strong></p>
        <p>• Target TP: <strong>$98,500</strong> | SL: <strong>$94,200</strong></p>
      </div>
    </div>

    <!-- Paper Trading Simulator -->
    <div class="card">
      <h2>Paper Trade Executer</h2>
      <p style="font-size: 0.85rem; color: #a0aec0; margin-bottom: 10px;">
        Virtual Balance: <strong style="color: #fff;">$10,000.00</strong>
      </p>
      <button class="btn btn-buy" onclick="alert('Paper Buy Order Placed!')">Execute AI BUY Signal</button>
      <button class="btn btn-sell" onclick="alert('Paper Sell Order Placed!')">Execute AI SELL Signal</button>
    </div>

  </div>

  <!-- TradingView Widget Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "15",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tradingview_chart"
    });
  </script>
</body>
</html>
