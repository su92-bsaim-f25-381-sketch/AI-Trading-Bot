<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePulse AI - Institutional Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <!-- Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg"><i class="fa-solid fa-robot text-xl text-white"></i></div>
      <div>
        <h1 class="text-xl font-bold tracking-wide text-blue-400">TradePulse AI</h1>
        <p class="text-xs text-slate-400">Quantitative Algorithmic Engine</p>
      </div>
    </div>

    <!-- Capital Input Widget -->
    <div class="flex items-center gap-2 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
      <i class="fa-solid fa-wallet text-emerald-400"></i>
      <span class="text-xs text-slate-400 font-medium">Capital ($):</span>
      <input id="capital-input" type="number" value="10000" class="w-24 bg-slate-900 text-emerald-400 font-bold text-sm px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-blue-500">
      <button onclick="updateCapital()" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded font-semibold transition">Set</button>
    </div>

    <!-- Live Status & Auto-Bot Toggle -->
    <div class="flex items-center gap-4">
      <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-xs font-mono">
        <span class="text-slate-400">Price: </span>
        <span id="live-price-badge" class="text-emerald-400 font-bold">Loading...</span>
      </div>
      <label class="flex items-center gap-2 cursor-pointer bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
        <span id="bot-status-label" class="text-xs font-bold text-red-400">AUTO BOT OFF</span>
        <input type="checkbox" id="bot-toggle" onchange="toggleBot(this)" class="sr-only">
        <div class="w-9 h-5 bg-slate-700 rounded-full relative p-0.5 transition duration-200 ease-in-out switch-bg">
          <div class="dot w-4 h-4 bg-white rounded-full transition duration-200 ease-in-out transform"></div>
        </div>
      </label>
    </div>
  </header>

  <!-- Main Container -->
  <main class="p-6 max-w-7xl mx-auto space-y-6">

    <!-- Market Selector & Metrics Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <label class="text-xs text-slate-400 font-semibold block mb-2">SELECT SYMBOL</label>
        <select id="symbol-select" onchange="onSymbolChanged()" class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-lg p-2.5 text-sm font-semibold focus:outline-none focus:border-blue-500">
          <option value="BINANCE:BTCUSDT" selected>BTC/USDT (Crypto 24/7)</option>
          <option value="BINANCE:ETHUSDT">ETH/USDT (Crypto 24/7)</option>
          <option value="OANDA:XAUUSD">XAU/USD (Gold)</option>
          <option value="FX:EURUSD">EUR/USD (Forex)</option>
        </select>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <span class="text-xs text-slate-400 font-semibold block mb-1">AUTO RISK LOT (1%)</span>
        <span id="calculated-lot" class="text-2xl font-bold text-blue-400">0.01</span>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <span class="text-xs text-slate-400 font-semibold block mb-1">RSI (14)</span>
        <span id="metric-rsi" class="text-2xl font-bold text-slate-200">--</span>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
        <span class="text-xs text-slate-400 font-semibold block mb-1">QUANT SIGNAL</span>
        <span id="quant-signal" class="text-sm font-bold text-yellow-400">WAITING FOR SETUP</span>
      </div>
    </div>

    <!-- Active Trades Terminal -->
    <div class="bg-slate-900 rounded-xl border border-slate-800 p-5">
      <h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-blue-400"></i> Active Executions
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-400">
          <thead class="bg-slate-800/50 uppercase font-semibold text-slate-300 border-b border-slate-700">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Symbol</th>
              <th class="p-3">Type</th>
              <th class="p-3">Lots</th>
              <th class="p-3">Entry</th>
              <th class="p-3">SL / TP</th>
              <th class="p-3">Time</th>
            </tr>
          </thead>
          <tbody id="trades-table-body" class="divide-y divide-slate-800 font-mono">
            <tr>
              <td colspan="7" class="p-4 text-center text-slate-500">No active trades executed yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let isBotActive = false;
    const backendUrl = "http://localhost:5000";

    async function updateCapital() {
      const cap = document.getElementById('capital-input').value;
      try {
        await fetch(`${backendUrl}/api/capital`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ capital: cap })
        });
        syncMarketData();
      } catch (err) { console.error("Capital update error:", err); }
    }

    async function syncMarketData() {
      const symbol = document.getElementById('symbol-select').value;
      try {
        const res = await fetch(`${backendUrl}/api/market?symbol=${symbol}`);
        const data = await res.json();
        
        document.getElementById('live-price-badge').innerText = "$" + data.price;
        document.getElementById('calculated-lot').innerText = data.auto_lot;
        document.getElementById('metric-rsi').innerText = data.rsi;
        document.getElementById('quant-signal').innerText = data.signal;

        if (isBotActive && (data.suggested_action === 'BUY' || data.suggested_action === 'SELL')) {
          autoExecuteTrade(symbol, data.suggested_action, data.auto_lot, data.price, data.atr);
        }
      } catch (err) { console.error("Sync Error:", err); }
    }

    async function autoExecuteTrade(symbol, action, lots, price, atr) {
      try {
        await fetch(`${backendUrl}/api/trade/execute`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ symbol, type: action, lots, price, atr })
        });
        syncActiveTrades();
      } catch (err) { console.error("Execution Error:", err); }
    }

    async function syncActiveTrades() {
      try {
        const res = await fetch(`${backendUrl}/api/trades/active`);
        const data = await res.json();
        const tbody = document.getElementById('trades-table-body');
        
        if (!data.active_trades.length) return;
        
        tbody.innerHTML = data.active_trades.map(t => `
          <tr class="hover:bg-slate-800/30">
            <td class="p-3 text-slate-500">#${t.id}</td>
            <td class="p-3 font-semibold text-slate-200">${t.symbol}</td>
            <td class="p-3 font-bold ${t.type === 'BUY' ? 'text-emerald-400' : 'text-red-400'}">${t.type}</td>
            <td class="p-3 text-blue-400">${t.lots}</td>
            <td class="p-3">${t.entry_price}</td>
            <td class="p-3 text-slate-500">${t.sl} / ${t.tp}</td>
            <td class="p-3 text-slate-500">${t.timestamp}</td>
          </tr>
        `).join('');
      } catch (err) { console.error("Trade Sync Error:", err); }
    }

    function toggleBot(checkbox) {
      isBotActive = checkbox.checked;
      const label = document.getElementById('bot-status-label');
      label.innerText = isBotActive ? "AUTO BOT ON" : "AUTO BOT OFF";
      label.className = isBotActive ? "text-xs font-bold text-emerald-400" : "text-xs font-bold text-red-400";
    }

    function onSymbolChanged() { syncMarketData(); }

    setInterval(syncMarketData, 3000);
    setInterval(syncActiveTrades, 4000);
  </script>
</body>
</html>
